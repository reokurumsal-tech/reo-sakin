<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reo Yönetim</title>
<style>
:root{--navy:#0b3b60}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#ust{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--navy);z-index:2}
#f{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:1px;min-width:100%;max-width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#f1f5f9;opacity:0;transition:opacity .25s}
#f.on{opacity:1}
.ek{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;color:var(--navy);text-align:center;padding:24px;z-index:3}
.ek img{width:96px;height:96px}
.ek b{font-size:1.1rem}
.ek p{margin:0;color:#64748b;font-size:.92rem;max-width:300px;line-height:1.45}
.ek button{border:0;border-radius:12px;background:var(--navy);color:#fff;font:600 1rem inherit;padding:12px 22px}
.dn{width:28px;height:28px;border:3px solid #cbd5e1;border-top-color:var(--navy);border-radius:50%;animation:d 1s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
.gz{display:none}
#kart{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:4;display:none}
#kart b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<div id="ust"></div>
<iframe id="f" title="Reo Yönetim" allow="clipboard-write"></iframe>
<div class="ek" id="yuk"><img src="logo.png" alt=""><div class="dn"></div></div>
<div class="ek gz" id="yok"><img src="logo.png" alt=""><b>İnternet bağlantısı yok</b><p>Reo Yönetim'ı kullanmak için internete bağlanın, sonra tekrar deneyin.</p><button type="button" id="tekrar">Tekrar dene</button></div>
<div id="kart"></div>
<script src="capacitor.js"></script>
<script src="app.js"></script>
</body>
</html>
