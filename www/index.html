<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reo E-Portal</title>
<style>
:root{--navy:#0b3b60}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;overscroll-behavior:none;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#ust{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--navy);z-index:2}
#f{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#f1f5f9;opacity:0;transition:opacity .25s}
#f.on{opacity:1}
.ek{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;color:var(--navy);text-align:center;padding:24px;z-index:3}
.ek img{width:96px;height:96px}
.ek b{font-size:1.1rem}
.ek p{margin:0;color:#64748b;font-size:.92rem;max-width:300px;line-height:1.45}
.ek button{border:0;border-radius:12px;background:var(--navy);color:#fff;font:600 1rem inherit;padding:12px 22px}
.dn{width:28px;height:28px;border:3px solid #cbd5e1;border-top-color:var(--navy);border-radius:50%;animation:d 1s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
.gz{display:none}
#kart{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:4;display:none}
#kart b{display:block;margin-bottom:2px}

/* Tanıtım turu (ilk açılış) */
#tur{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#0b3b60,#072a45);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 22px)}
#tur.gz{display:none}
#tur .ust{display:flex;justify-content:flex-end}
#tur .atla{background:none;border:0;color:#cbd5e1;font-weight:600;font-size:.95rem;font-family:inherit;padding:8px 4px}
#tur .sl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;max-width:420px;margin:0 auto}
#tur .ik{width:120px;height:120px;border-radius:32px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
#tur .ik svg{width:64px;height:64px}
#tur h2{margin:0;font-size:1.45rem;line-height:1.25}
#tur p{margin:0;color:#cbd5e1;font-size:1rem;line-height:1.55}
#tur .alt{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:420px;width:100%;margin:0 auto}
#tur .nk{display:flex;gap:8px}
#tur .nk i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);transition:all .2s}
#tur .nk i.on{width:22px;background:#34d399}
#tur .ileri{border:0;border-radius:14px;background:#fff;color:#0b3b60;font-weight:700;font-size:1rem;font-family:inherit;padding:14px 26px;min-width:120px}
/* Çıkış onayı */
#cik{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#cik.gz{display:none}
#cik .k{background:#fff;color:#0f172a;border-radius:18px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#cik b{display:block;font-size:1.08rem;margin-bottom:6px}
#cik p{margin:0 0 18px;color:#64748b;font-size:.94rem;line-height:1.45}
#cik .r{display:flex;gap:10px;justify-content:flex-end}
#cik button{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:12px;font-weight:600;font-size:.95rem;font-family:inherit;padding:11px 18px}
#cik button.a{background:#0b3b60;border-color:#0b3b60;color:#fff}
</style>
</head>
<body>
<div id="ust"></div>
<iframe id="f" title="Reo E-Portal" allow="clipboard-write"></iframe>
<div class="ek" id="yuk"><img src="logo.png" alt=""><div class="dn"></div></div>
<div class="ek gz" id="yok"><img src="logo.png" alt=""><b>İnternet bağlantısı yok</b><p>Reo E-Portal'ı kullanmak için internete bağlanın, sonra tekrar deneyin.</p><button type="button" id="tekrar">Tekrar dene</button></div>
<div id="kart"></div>
<div id="tur" class="gz" role="dialog" aria-modal="true"><div class="ust"><button type="button" class="atla" id="turAtla">Atla</button></div><div class="sl" id="turSl"></div><div class="alt"><div class="nk" id="turNk"></div><button type="button" class="ileri" id="turIleri">İleri</button></div></div>
<div id="cik" class="gz" role="dialog" aria-modal="true"><div class="k"><b id="cikB">Uygulamadan çıkılsın mı?</b><p id="cikP">REO Sakin Portalı kapatılacak.</p><div class="r"><button type="button" id="cikV">Vazgeç</button><button type="button" class="a" id="cikE">Çık</button></div></div></div>
<script src="capacitor.js"></script>
<script src="app.js"></script>
</body>
</html>
